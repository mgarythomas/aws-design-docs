# ==============================================================================
# Flyway Configuration — Exchange Platform
#
# Sensitive values (url, user, password) are NOT stored here.
# They are injected as environment variables in the GitLab CI pipeline:
#   FLYWAY_URL      → jdbc:postgresql://<host>:<port>/<db>
#   FLYWAY_USER     → database username
#   FLYWAY_PASSWORD → database password (from AWS Secrets Manager)
# ==============================================================================

# Location of migration scripts, relative to repo root when called from CI
flyway.locations=filesystem:exchange-platform/database/migrations

# Fail fast if checksums of already-applied scripts change (detects accidental edits)
flyway.validateOnMigrate=true

# Fail the pipeline if any migration is out-of-order (strict versioning enforced)
flyway.outOfOrder=false

# Baseline must be explicitly set if migrating a pre-existing database for the first time
# flyway.baselineOnMigrate=false

# Default schema; Flyway will create this if it doesn't exist
flyway.defaultSchema=public

# Table that stores the migration history
flyway.table=flyway_schema_history

# Encoding for all migration scripts
flyway.encoding=UTF-8

# Clean is disabled in all environments — prevents accidental data loss
flyway.cleanDisabled=true
