version: '3.8'

services:
  validation-engine:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OPA_URL=http://opa:8181
      # Note: For AWS SDK to access S3 locally, configure credentials via AWS_PROFILE and volume mount, or pass keys directly.
      # - AWS_ACCESS_KEY_ID=your_access_key
      # - AWS_SECRET_ACCESS_KEY=your_secret_key
      - AWS_REGION=ap-southeast-2
      - S3_BUCKET_POLICIES=det-exchange-policies
    depends_on:
      - opa
    networks:
      - validation-net

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr"
      - ":8181"
      # OPA starts without embedded policies. The Spring Boot application will automatically pull them from S3 and push them to OPA dynamically.
    networks:
      - validation-net

networks:
  validation-net:
    driver: bridge
